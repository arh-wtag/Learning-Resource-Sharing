trigger:
- "*"

schedules:
- cron: "11 11 * * *"
  displayName: Morning check
  branches:
    include:
    - main
  always: true

pool:
  vmImage: ubuntu-latest

steps:
- script: echo Hello, check2!
  displayName: 'Run a one-line script'
  condition: and(succeeded(), ne(variables['Build.Reason'], 'Schedule'))
- script: echo done
  displayName: 'Check to run'

